# cspell:ignore rksharma
name: Sync labels

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - "main"
    paths:
      - "package.json"
      - "eng/common/config/"
      - "eng/common/labels/"
      - ".github/workflows/sync-labels.yml"

  workflow_dispatch: {}

permissions:
  issues: write

jobs:
  sync:
    if: github.repository == 'microsoft/typespec'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - run: pnpm install
        name: Install dependencies

      - run: pnpm sync-labels --github
        name: Sync labels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sync-fork:
    if: github.repository == 'rksharma-owg/typespec'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Copy missing upstream labels while preserving fork labels
        run: gh label clone microsoft/typespec --repo "$GH_REPO"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
